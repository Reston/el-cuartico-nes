MEMORY {
 ZP: file="", start=$0002, size=$00FE, type=rw;
 HEADER: file=%O, start=0, size=$10, fill=yes;
 INTRO: file=%O, start=$8000, size=$2000, type=ro, fill=yes, fillval=$FF;
 SCENEDATA: file=%O, start=$8000, size=$2000, type=ro, fill=yes, fillval=$FF;
 CARDS: file=%O, start=$8000, size=$2000, type=ro, fill=yes, fillval=$FF;
 EXPANSION: file=%O, start=0, size=$12000, fill=yes, fillval=$FF;
 ROM: file=%O, start=$8000, size=$6000, fill=yes, fillval=$FF;
 BOOT: file=%O, start=$E000, size=$1FFA, fill=yes, fillval=$FF;
 VEC: file=%O, start=$FFFA, size=6, fill=yes;
 CHR: file=%O, start=0, size=$40000, fill=yes;
 RAM: file="", start=$0300, size=$0400, type=rw, define=yes;
}
SEGMENTS {
 ZEROPAGE: load=ZP, type=zp;
 HEADER: load=HEADER, type=ro;
 STARTUP: load=BOOT, type=ro;
 SCENES: load=SCENEDATA, type=ro;
 EXTRACODE: load=BOOT, type=ro;
 BOOTDATA: load=BOOT, type=ro;
 CARDDATA: load=CARDS, type=ro;
 INTRODATA: load=INTRO, type=ro;
 PRESENTATIONDATA: load=INTRO, type=ro;
 INTROCODE: load=BOOT, type=ro;
 LOWCODE: load=ROM, type=ro, optional=yes;
 ONCE: load=ROM, type=ro, optional=yes;
 CODE: load=ROM, type=ro;
 RODATA: load=ROM, type=ro;
 DATA: load=ROM, run=RAM, type=rw, define=yes;
 BSS: load=RAM, type=bss, define=yes;
 VECTORS: load=VEC, type=ro;
 CHARS: load=CHR, type=ro;
}
